[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skx-infra-guard"
version = "0.1.0"
description = "Policy enforcement, risk analysis, and governance for AI agents operating on infrastructure"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "sqlparse>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
skx-guard = "skx_infra_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
